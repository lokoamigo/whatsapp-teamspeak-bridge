[program:teamspeak]
command=/usr/local/bin/start-teamspeak
user=bridge
priority=50
autostart=%(ENV_BRIDGE_TEAMSPEAK_AUTOSTART)s
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DISPLAY=":99",XDG_RUNTIME_DIR="/tmp/runtime-bridge",PULSE_SERVER="unix:/tmp/runtime-bridge/pulse/native"

[program:mumble]
command=/usr/local/bin/start-mumble
user=bridge
priority=50
autostart=%(ENV_BRIDGE_MUMBLE_AUTOSTART)s
autorestart=true
startsecs=5
; Only signal the wrapper: it quits Mumble cleanly so Mumble.conf is saved.
; killasgroup still reaps the whole group if that takes longer than stopwaitsecs.
stopasgroup=false
killasgroup=true
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DISPLAY=":99",XDG_RUNTIME_DIR="/tmp/runtime-bridge",PULSE_SERVER="unix:/tmp/runtime-bridge/pulse/native"

