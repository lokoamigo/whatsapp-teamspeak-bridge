[program:xvfb]
command=/usr/local/bin/start-xvfb
user=bridge
priority=10
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DISPLAY=":99",HOME="/data/home",XDG_RUNTIME_DIR="/tmp/runtime-bridge",PULSE_SERVER="unix:/tmp/runtime-bridge/pulse/native"

