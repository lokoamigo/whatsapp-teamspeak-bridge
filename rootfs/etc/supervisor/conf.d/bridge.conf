autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:clientquery-watchdog]
command=/usr/local/bin/clientquery-watchdog.py
user=root
priority=70
autostart=%(ENV_BRIDGE_TEAMSPEAK_AUTOSTART)s
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bridge-bot]
command=/usr/local/bin/start-bridge-bot
user=bridge
priority=50
autostart=true
autorestart=true
startsecs=5
; A FATAL bot inside a running container is invisible to Docker's restart
; policy. Supervisor waits one second longer before each retry, so 50 retries
; keep trying for about 20 minutes before giving up.
startretries=50
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DISPLAY=":99",HOME="/data/home",XDG_CONFIG_HOME="/data/home/.config",XDG_RUNTIME_DIR="/tmp/runtime-bridge",PULSE_SERVER="unix:/tmp/runtime-bridge/pulse/native"
