[package]
name = "bridge-mumble"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
anyhow = "1"
bytes = "1"
mumble-client-protocol = { git = "https://github.com/Mumcord/mumble-client-protocol", rev = "3d883aa4d8d9a1b8910dc4fb6b8bdf8cff788503" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
url = "2"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
