name: Version

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Validate project version
        run: node scripts/version.js check
      - name: Install bot dependencies
        run: npm ci --omit=dev
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Test bot
        run: npm test
