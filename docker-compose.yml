services:
  bridge:
    build:
      context: .
      args:
        TS3_VERSION: "${TS3_VERSION:-3.6.2}"
        TS3_LICENSE_ACCEPTED: "${TS3_LICENSE_ACCEPTED:-NO}"
    container_name: whatsapp-teamspeak-bridge
    restart: unless-stopped
    shm_size: "2gb"
    environment:
      TZ: "${TZ:-Europe/Berlin}"
      VNC_PASSWORD: "${VNC_PASSWORD:-change-me-now}"
      DISPLAY_WIDTH: "${DISPLAY_WIDTH:-1440}"
      DISPLAY_HEIGHT: "${DISPLAY_HEIGHT:-900}"
      DISPLAY_DEPTH: "${DISPLAY_DEPTH:-24}"
      TS3_URI: "${TS3_URI:-}"
      TS3_CLIENTQUERY_API_KEY: "${TS3_CLIENTQUERY_API_KEY:-}"
      BRIDGE_COMMAND_PREFIX: "${BRIDGE_COMMAND_PREFIX:-!wa}"
      BRIDGE_COMMANDER_UIDS: "${BRIDGE_COMMANDER_UIDS:-}"
      BRIDGE_CONTACT_GROUPS: "${BRIDGE_CONTACT_GROUPS:-{}}"
      BRIDGE_WHATSAPP_INVITE_COMMAND: "${BRIDGE_WHATSAPP_INVITE_COMMAND:-!invite}"
      BRIDGE_WHATSAPP_CHANNEL_POLL_MAX_OPTIONS: "${BRIDGE_WHATSAPP_CHANNEL_POLL_MAX_OPTIONS:-12}"
      BRIDGE_AUTO_ACCEPT_POLL_MS: "${BRIDGE_AUTO_ACCEPT_POLL_MS:-5000}"
      BRIDGE_API_PORT: "${BRIDGE_API_PORT:-8080}"
      WWEBJS_CHROMIUM_EXECUTABLE: "/usr/bin/chromium"
      WWEBJS_CHROMIUM_PROFILE: "/data/chromium"
    ports:
      # Sicherer Standard: nur auf dem Docker-Host erreichbar. Für Fernzugriff SSH-Tunnel nutzen.
      - "127.0.0.1:${NOVNC_PORT:-6080}:6080"
      - "127.0.0.1:${CHROMIUM_DEBUG_PORT:-9222}:9222"
      - "127.0.0.1:${CLIENTQUERY_PORT:-25640}:25640"
      - "127.0.0.1:${BRIDGE_API_PORT:-8080}:${BRIDGE_API_PORT:-8080}"
    volumes:
      - bridge-data:/data

volumes:
  bridge-data:
